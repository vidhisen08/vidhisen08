name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#D2042D&color_dots=#ebedf0,#ffc2cc,#ff7a8f,#e0304d,#9e0f26
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff2e4f&color_dots=#161b22,#5c1a26,#8f1f33,#c4233f,#ff4d6a

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
